<svg width="100%" viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif'>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(31,30,29,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="380" height="64" rx="10" fill="rgb(247,240,226)" stroke="rgb(140,104,40)" stroke-width="0.5"/><text x="230.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">App</text><text x="230.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">WinUI 3 界面</text>
<text x="440" y="62" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">只能在 Windows 里编译</text>
<rect x="40" y="114" width="380" height="64" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="230.0" y="136.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Presentation</text><text x="230.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">界面状态 ViewModel，和 Mac 版一一对应</text>
<text x="440" y="146" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">Mac 上可以测</text>
<rect x="40" y="198" width="380" height="64" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="230.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Platform</text><text x="230.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">注册表、文件系统、Win32 调用</text>
<text x="440" y="230" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">Mac 上也能编译</text>
<rect x="40" y="282" width="380" height="64" rx="10" fill="rgb(231,241,234)" stroke="rgb(46,105,64)" stroke-width="0.5"/><text x="230.0" y="304.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Core</text><text x="230.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">清理规则、路径安全检查、卸载残留判断</text>
<text x="440" y="314" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">只依赖 .NET，内存文件系统里测</text>
<text x="230" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">越往下越不碰 Windows，越多代码可以在 Mac 上验证</text>
</svg>
