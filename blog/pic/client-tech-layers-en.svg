<svg width="100%" viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif'>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(31,30,29,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="380" height="64" rx="10" fill="rgb(247,240,226)" stroke="rgb(140,104,40)" stroke-width="0.5"/><text x="230.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">App</text><text x="230.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">WinUI 3 interface</text>
<text x="440" y="62" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">builds only on Windows</text>
<rect x="40" y="114" width="380" height="64" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="230.0" y="136.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Presentation</text><text x="230.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">ViewModels, one-to-one with the Mac app</text>
<text x="440" y="146" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">tested on the Mac</text>
<rect x="40" y="198" width="380" height="64" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="230.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Platform</text><text x="230.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">registry, file system, Win32 calls</text>
<text x="440" y="230" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">compiles on the Mac too</text>
<rect x="40" y="282" width="380" height="64" rx="10" fill="rgb(231,241,234)" stroke="rgb(46,105,64)" stroke-width="0.5"/><text x="230.0" y="304.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Core</text><text x="230.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">cleanup rules, path safety, leftover checks</text>
<text x="440" y="314" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">.NET only, tested on an in-memory FS</text>
<text x="230" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">The lower the layer, the less Windows it touches, the more runs on the Mac</text>
</svg>
