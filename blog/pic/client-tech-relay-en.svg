<svg width="100%" viewBox="0 0 680 324" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif'>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgba(31,30,29,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">MiaoYan: editor and preview scroll together</text>
<rect x="40" y="44" width="160" height="76" rx="10" fill="rgb(247,240,226)" stroke="rgb(140,104,40)" stroke-width="0.5"/><text x="120.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)"></text>
<text x="120" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">C</text>
<text x="120" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">cmark-gfm tags each</text>
<text x="120" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">block with its line</text>
<rect x="260" y="44" width="160" height="76" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="340.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)"></text>
<text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">JS</text>
<text x="340" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">reads tags, finds</text>
<text x="340" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">the current line</text>
<rect x="480" y="44" width="160" height="76" rx="10" fill="rgb(231,241,234)" stroke="rgb(46,105,64)" stroke-width="0.5"/><text x="560.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)"></text>
<text x="560" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Swift</text>
<text x="560" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">editor jumps to</text>
<text x="560" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">that spot</text>
<line x1="200" y1="82" x2="256" y2="82" stroke="rgba(31,30,29,0.3)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="420" y1="82" x2="476" y2="82" stroke="rgba(31,30,29,0.3)" stroke-width="1" marker-end="url(#arrow)"/><text x="448.0" y="72.0" text-anchor="middle" font-size="12" fill="rgb(95,94,90)">message</text>
<text x="40" y="170" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Kaku: type # plus a sentence and press Enter</text>
<rect x="40" y="190" width="120" height="64" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/><text x="100.0" y="212.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">zsh</text><text x="100.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">escape sequence</text>
<rect x="200" y="190" width="120" height="64" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="260.0" y="212.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Lua</text><text x="260.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">gets the sentence</text>
<rect x="360" y="190" width="120" height="64" rx="10" fill="rgb(247,240,226)" stroke="rgb(140,104,40)" stroke-width="0.5"/><text x="420.0" y="212.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Rust</text><text x="420.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">asks the model</text>
<rect x="520" y="190" width="120" height="64" rx="10" fill="rgb(230,236,244)" stroke="rgb(27,54,93)" stroke-width="0.5"/><text x="580.0" y="212.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Lua</text><text x="580.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">fills it back</text>
<line x1="160" y1="222" x2="196" y2="222" stroke="rgba(31,30,29,0.3)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="222" x2="356" y2="222" stroke="rgba(31,30,29,0.3)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="222" x2="516" y2="222" stroke="rgba(31,30,29,0.3)" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M580 254 V290 H100 V258" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="1" marker-end="url(#arrow)"/>
<text x="340" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="rgb(95,94,90)">back in zsh: take a look, then press Enter</text>
